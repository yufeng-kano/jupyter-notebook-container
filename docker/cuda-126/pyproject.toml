[project]
name = "uv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*" 
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.4.1",
    "diffusers[torch]>=0.35.2",
    "evaluate>=0.4.6",
    "gdown>=5.2.0",
    "jlab-enhanced-cell-toolbar>=3.5.1",
    "jupyter>=1.1.1",
    "jupyterlab-language-pack-zh-tw>=4.4.post3",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "safetensors>=0.7.0",
    "scikit-learn>=1.7.2",
    "tensorflow>=2.20.0",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url  = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
